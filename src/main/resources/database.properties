# Configuracion de conexion a MySQL leida por mx.edu.utch.melo.db.ConexionDB.
#
# Este archivo SI se sube al repositorio -- por eso db.usuario/db.contrasena
# NO tienen valor aqui (antes tenian "root"/vacio, un default inseguro que
# la Fase 4 de la auditoria elimino). Configuralos en uno de estos dos
# lugares, nunca aqui:
#
#   1. Variables de entorno DB_URL / DB_USER / DB_PASSWORD (tienen prioridad
#      sobre este archivo y sobre .env).
#   2. Un archivo .env en la raiz del proyecto (nunca se sube al repo, ver
#      .gitignore) con las claves db.url / db.usuario / db.contrasena.
#
# db.url si tiene un valor por defecto seguro (localhost) si no lo defines
# en ningun lado -- no es una credencial, solo el destino de conexion.
#
# db.url=jdbc:mysql://localhost:3306/melo_pos?sslMode=PREFERRED&serverTimezone=UTC
# db.usuario=tu_usuario
# db.contrasena=tu_contrasena
